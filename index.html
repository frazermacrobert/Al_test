<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EX Values • Slider Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>EX Values — prototype</h1>
    <p class="sub">Rank where each value sits: underplayed → overplayed</p>
  </header>

  <main>
    <section class="card">
      <div class="values-grid">
        <div class="value-block">
          <label class="value-label">
            <span contenteditable="true" spellcheck="false" data-placeholder="Value 1">Value 1</span>
          </label>
          <div class="slider-wrap">
            <div class="scale-labels">
              <span>Underplayed</span>
              <span>Balanced</span>
              <span>Overplayed</span>
            </div>
            <input type="range" min="-2" max="2" step="1" value="0" class="slider" data-name="Value 1">
            <div class="ticks">
              <span>-2</span><span>-1</span><span>0</span><span>1</span><span>2</span>
            </div>
          </div>
        </div>

        <div class="value-block">
          <label class="value-label">
            <span contenteditable="true" spellcheck="false" data-placeholder="Value 2">Value 2</span>
          </label>
          <div class="slider-wrap">
            <div class="scale-labels">
              <span>Underplayed</span>
              <span>Balanced</span>
              <span>Overplayed</span>
            </div>
            <input type="range" min="-2" max="2" step="1" value="0" class="slider" data-name="Value 2">
            <div class="ticks">
              <span>-2</span><span>-1</span><span>0</span><span>1</span><span>2</span>
            </div>
          </div>
        </div>

        <div class="value-block">
          <label class="value-label">
            <span contenteditable="true" spellcheck="false" data-placeholder="Value 3">Value 3</span>
          </label>
          <div class="slider-wrap">
            <div class="scale-labels">
              <span>Underplayed</span>
              <span>Balanced</span>
              <span>Overplayed</span>
            </div>
            <input type="range" min="-2" max="2" step="1" value="0" class="slider" data-name="Value 3">
            <div class="ticks">
              <span>-2</span><span>-1</span><span>0</span><span>1</span><span>2</span>
            </div>
          </div>
        </div>
      </div>

      <div class="results card">
        <h2>Current scores</h2>
        <ul id="resultsList"></ul>
        <div class="actions">
          <button id="resetBtn" class="secondary">Reset to 0</button>
          <button id="copyBtn">Copy JSON</button>
          <a id="downloadBtn" download="ex-values.json" class="linklike">Download JSON</a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <small>Built as a quick demo. Edit the value names inline.</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
